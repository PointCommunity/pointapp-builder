version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep the documented TypeScript 5.9 toolchain until the TypeScript 6 migration is tested.
      - dependency-name: typescript
        versions: ['>=6.0.0']
    groups:
      npm-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      workflow-dependencies:
        patterns: ['*']
